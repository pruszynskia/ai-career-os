project:
  name: <Project Name> MVP
  version: 1.0
  github:
    repository: <owner>/<repository>
    project: <Project Name> MVP
  labels:
    - architecture
    - setup
    - frontend
    - backend
    - database
    - ui
    - auth
    - feature
    - ai
    - state
    - testing
    - quality
    - deployment
    - documentation
  statuses:
    - backlog
    - todo
    - in-progress
    - review
    - blocked
    - done
  priorities:
    - P0
    - P1
    - P2
    - P3
  estimates:
    - XS
    - S
    - M
    - L
    - XL
tasks:
  ###############################################################################
  # TASK-001 — example task, replace with your real backlog
  ###############################################################################
  - id: TASK-001
    github:
      issue: null
      project_item: null
    status: todo
    priority: P0
    estimate: XS
    depends_on: []
    title: Initialize repository foundation
    goal: >
      Create production-ready project foundation with minimal, deterministic configuration for AI-assisted development.

    scope:
      - package.json
      - tsconfig.json
      - eslint.config.*
      - prettier.config.*
      - .editorconfig
      - .gitignore
    deliverables:
      - Project builds successfully
      - ESLint configured
      - Prettier configured
      - TypeScript configured
    tasks:
      - Verify framework configuration
      - Configure TypeScript
      - Configure ESLint
      - Configure Prettier
      - Verify production build
    acceptance:
      - npm run build succeeds
      - npm run lint succeeds
      - TypeScript has zero errors
    done:
      - Build passes
      - Lint passes
      - Configuration committed
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/PRODUCT.md
      - docs/CODING_STANDARDS.md
    prompt: |
      Implement ONLY this task.

      Follow all referenced documentation.

      Keep implementation minimal.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Add unnecessary dependencies
      - Refactor unrelated files
      - Introduce experimental tooling
