  # TASK-056
  ###############################################################################
  - id: TASK-056
    github:
      issue: "119"
      project_item: PVTI_lAHOBIVK2M4BeQfRzg4aSvs
    status: done
    priority: P1
    estimate: L
    milestone: "Monetization Milestone"
    depends_on:
      - TASK-002
      - TASK-053
      - TASK-055
    title: Subscriptions schema, Stripe Checkout and webhook
    goal: >
      Take money - the billing core of the Monetization Milestone. Add a subscriptions table, a Checkout-session route and the Stripe webhook that writes subscription state back, so an account can move from free to paid. No billing code, table or dependency exists anywhere today. This is the first thing in the codebase that legitimately writes with the service-role client from a request path, because a signature-verified webhook has no user session and therefore no auth.uid() for RLS to match, so it records a new ADR.

    scope:
      - supabase/migrations/*.sql
      - src/shared/billing/stripe.ts
      - src/entities/subscription/types.ts
      - src/entities/subscription/service.ts
      - src/features/billing/services/create-checkout-session.service.ts
      - src/features/billing/services/sync-subscription.service.ts
      - src/app/api/billing/checkout/route.ts
      - src/app/api/stripe/webhook/route.ts
      - src/features/marketing/components/pricing-table.tsx
      - memory-bank/decisions.md
      - ARCHITECTURE.md
      - docs/TECH_STACK.md
    deliverables:
      - A subscriptions table with owner_id and the same owner_all RLS policy every existing table uses, readable by its owner and written only by the webhook
      - src/entities/subscription/{types.ts,service.ts} following the existing entity-service convention
      - POST /api/billing/checkout creating a Stripe Checkout session for the signed-in owner
      - POST /api/stripe/webhook verifying the Stripe signature and syncing subscription state
      - ADR-015 in memory-bank/decisions.md recording the Stripe dependency, the billing table and the single sanctioned service-role write path
    tasks:
      - "Add a migration: create table subscriptions (id uuid pk default gen_random_uuid(), owner_id uuid not null references auth.users(id), stripe_customer_id text not null, stripe_subscription_id text unique, status text not null, plan text not null, current_period_end timestamptz, created_at timestamptz not null default now(), updated_at timestamptz not null default now()), a unique index on owner_id, an index on stripe_customer_id, and the owner_all RLS policy matching supabase/migrations/20260724180956_init.sql"
      - Add src/shared/billing/stripe.ts exporting a lazily-constructed Stripe client reading STRIPE_SECRET_KEY, marked 'server-only' the same way src/shared/ai/service.ts is
      - Add src/entities/subscription/types.ts (Subscription type plus Zod schema) and service.ts (findByOwnerId, findByStripeCustomerId, upsertFromStripe), mirroring src/entities/application/service.ts's snake_case-to-camelCase row mapping
      - Add src/features/billing/services/create-checkout-session.service.ts creating or reusing the Stripe customer for the owner and returning a Checkout session url for the requested tier's price id
      - Add src/app/api/billing/checkout/route.ts (POST) - getOwnerId, Zod-validate the requested plan, call that one service, return the url - keeping the route handler thin per ADR-006
      - Add src/features/billing/services/sync-subscription.service.ts translating a Stripe subscription object into an upsert on subscriptions, using createAdminClient() because the webhook has no user session
      - Add src/app/api/stripe/webhook/route.ts verifying the signature with STRIPE_WEBHOOK_SECRET against the raw body and handling checkout.session.completed, customer.subscription.updated and customer.subscription.deleted by delegating to that service
      - Wire the pricing table's call to action to POST /api/billing/checkout for a signed-in user, and to /sign-up for an anonymous one
      - Record ADR-015 in memory-bank/decisions.md and note the billing layer in ARCHITECTURE.md and docs/TECH_STACK.md, which already anticipates a subscriptions table
    acceptance:
      - Completing Stripe Checkout in test mode writes a subscriptions row for that owner with status active and the chosen plan
      - A customer.subscription.deleted webhook event updates that row's status rather than inserting a second one
      - The webhook rejects a request whose Stripe signature is missing or invalid, and does not write
      - Querying subscriptions through the normal request client returns only the signed-in owner's row
      - createAdminClient() appears only in the webhook's service path, and STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are read only in server-only modules - neither is exposed through a NEXT_PUBLIC_ variable or reaches a component
      - ADR-015 is recorded in memory-bank/decisions.md
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
    done:
