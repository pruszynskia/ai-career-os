      - Create root layout and app providers
      - Add React Query provider
      - Add Zustand store scaffolding for UI state
      - Build sidebar navigation widget with placeholder routes
    acceptance:
      - App renders the shell with working navigation
      - Providers available to all app routes
      - npm run build and npm run lint succeed
    done:
