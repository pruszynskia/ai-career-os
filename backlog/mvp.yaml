      - A variation check refusing a draft whose opening line, ask sentence or sign-off matches one this owner generated in the last 30 days
      - A real-contact rule - with no contact on file the app says so and offers the posting URL rather than drafting to an invented recipient
      - An outreach panel on the offer detail showing all three drafts with live character counts, ready to copy
    tasks:
      - Add a migration creating outreach_messages with owner_id, job_offer_id, channel, subject, body, contact_name, contact_url, status and created_at, plus the standard owner_all RLS policy every other table uses
      - Add the outreach-message entity slice with its Zod schema and service, following the existing entity pattern
      - Write src/shared/ai/prompts/outreach.ts composing the TASK-081 generation contract and adding the voice rules - short lines rather than paragraphs, the reason for writing in the first line, the raw posting URL pasted inline unformatted, one hedged line of overlap, one small ask, a first-name sign-off, and no contact block inside a message
      - State in the prompt that a dropped comma or an unbalanced sentence is acceptable and flawless parallel structure reads as generated, and that typos must never be manufactured
      - Write outreach-validator.ts checking the ban list - I hope this message finds you well, I came across your profile, Quick background, A bit about me, I would welcome the chance, leverage, passionate about, excited about the opportunity, strong fit, reach out - plus more than one em dash used as a connector, a tricolon, a bulleted skill stack inside a direct message, a full signature block, and two asks in one message
      - Enforce the per-channel character budget in the validator, failing a connection note over 300 characters outright
      - Implement the variation check by querying this owner's outreach_messages from the last 30 days and comparing the opening line, the ask sentence and the sign-off for a verbatim collision
      - Rewrite recruiter-message.service.ts to generate all three channels in one call, validate each, persist them, and return them together
      - Add POST /api/offers/[id]/outreach and an offer-detail panel rendering the three drafts with live character counts and a copy action
      - Block the recruiter-addressed channels when no contact is on file, showing the posting URL and the reason instead of a draft with a placeholder name
      - Add outreach-validator.test.ts covering a ban-list hit, an over-budget connection note, a two-ask draft, a 30-day collision and a clean pass
    acceptance:
