    title: Onboarding CV upload step - dropzone, progress and parsed-profile summary
    goal: >
      Onboarding step 2's CV upload (`src/features/cv/components/cv-upload-form.tsx`) currently reuses the generic `DocumentUploadForm` (`src/features/cv/components/document-upload-form.tsx`): a plain file `<Input type="file">` with no drag-and-drop, no file chip, and no unsupported-file feedback beyond the browser's native `accept` filtering. `useUploadCv` (`src/features/cv/hooks/use-upload-cv.ts`) calls `uploadCv` and on success only shows a toast and calls `router.refresh()` - it discards the mutation's resolved value. `uploadCv` (`src/features/cv/services/upload-cv.service.ts`) returns `{ profile, cvDocument }`, where `profile` is the upserted `Profile` carrying the parsed `summary: string`, `skills: string[]`, `experience`, `projects` and `score` (per `parsedProfileSchema` in `src/entities/profile/types.ts`). Resolving the plan's open question: the onb2-done summary must read from the server-refreshed profile (a fresh `profileService.findUnique(ownerId)` read in the onboarding page/step after `router.refresh()`), not from the client mutation's return value, since `useUploadCv` never surfaces that value today.

    scope:
      - src/features/cv/components/cv-upload-form.tsx
      - src/features/cv/components/document-upload-form.tsx
      - src/features/cv/hooks/use-upload-cv.ts
      - src/widgets/onboarding-panel/onboarding-panel.tsx
    deliverables:
      - A CV upload step with a dropzone (drag-and-drop + click-to-browse), matching `X-onb2.dc.html`
      - A file chip showing the selected file name with a remove action, matching `X-onb2.dc.html`
      - An uploading/progress state matching `X-onb2-uploading.dc.html`
      - A done state (`X-onb2-done.dc.html`) showing a parsed-profile summary sourced from the profile re-read after upload succeeds (owner-scoped, server-side), not from client mutation state
      - An inline unsupported-file error state (`X-onb2-error.dc.html`) for a file rejected before or during upload (wrong extension, or the mutation's `onError`), rendered inline in the step rather than only as a toast
    tasks:
      - Build a dropzone variant of `DocumentUploadForm` (or a new component built alongside it, reusing its Input/ mutation-wiring pattern) supporting drag-and-drop file selection plus the existing click-to-browse input, constrained to `.pdf`/`.docx`
      - Add a file-chip UI (file name + remove button clearing `file` state) shown once a file is selected, before submit
      - Reuse `mutation.isPending` for the uploading/progress visual state (`X-onb2-uploading.dc.html`); this component has no real upload-percentage source, so treat it as an indeterminate pending state, not a fake percentage
      - On successful upload, instead of (or in addition to) `router.refresh()`, have the onboarding step re-read the owner's profile server-side (`profileService.findUnique`) and pass `profile.summary`/`profile.skills` etc. into a done-state summary view per `X-onb2-done.dc.html`
      - Reject non-`.pdf`/`.docx` files inline (before calling the mutation) with an error state per `X-onb2-error.dc.html`, and also render the mutation's `onError` message inline in the step (in addition to or instead of the existing toast) rather than leaving upload failures toast-only
    acceptance:
