      - Define --font-display in the @theme inline block and re-point --font-heading from var(--font-sans) to the display face, so Heading, CardTitle and DialogTitle pick it up without individual edits
      - Add the gapped scale to globals.css - label 11px uppercase mono with +0.08em tracking, body-sm 13px, body 14px, body-lg 16px, then h3 clamp(20px, 1.4vw + .8rem, 24px), h2 clamp(26px, 2.2vw + .8rem, 32px), h1 clamp(32px, 3.2vw + 1rem, 44px) and display clamp(44px, 6vw + 1rem, 72px), with negative tracking rising through the display sizes
      - Update the Text primitive so its default size is the 13px dense step, and update Heading so each level maps to the new scale rather than to Tailwind's text-2xl / text-xl defaults
