  - id: TASK-081
    github:
      issue: "165"
      project_item: PVTI_lAHOBIVK2M4BeQfRzg6jIvo
    status: done
    priority: P1
    estimate: L
    milestone: "Stage 3 - Evidence and Signal"
    depends_on:
      - TASK-078
      - TASK-022
    title: Evidence-grounded generation contract and claim validator
    goal: >
      Every generator prompt in src/shared/ai/prompts says some variation of do not invent experience, and nothing checks whether it complied. Replace that hope with a contract - each generator reads the evidence base with claim states rather than raw CV text, returns the claim ids it used, and has its output rejected in TypeScript if it cites an id outside the base or breaks a neverInclude rule. This is what makes the product promise defensible rather than decorative, and it is the shared layer TASK-082, TASK-083 and TASK-087 all build on.

    scope:
      - src/shared/ai/prompts/tailor-cv.ts
      - src/shared/ai/prompts/cover-letter.ts
      - src/shared/ai/prompts/recruiter-message.ts
      - src/shared/ai/prompts/generation-contract.ts
      - src/shared/ai/claim-validator.ts
      - src/shared/ai/claim-validator.test.ts
      - src/features/job-offer/services/tailor-cv.service.ts
      - src/features/job-offer/services/cover-letter.service.ts
      - src/features/job-offer/services/recruiter-message.service.ts
    deliverables:
      - generation-contract.ts exporting one shared prompt fragment every generator composes into its system prompt
      - A tri-state rule in that fragment - a TRUSTED or CONFIRMED claim is usable and may be reordered, emphasised or rephrased, a FLAGGED claim is never presented as a strength, and an absent requirement is a gap stated plainly rather than written around
      - Every generation returning claimsUsed as an array of claim ids
      - claim-validator.ts rejecting output citing an unknown id, an EXCLUDED claim, or a neverInclude rule, in TypeScript rather than in the prompt
      - An impact rule - a bullet leads with a metric only when that metric is already stored on the claim, never estimated or rounded
      - A relevance rule - a claim whose only justification is that it is true, rather than relevant to this posting, is cut
      - A verb rule - strengthen wording without changing the claim, so contributed is never upgraded to led
      - A serialiser turning the evidence base into the prompt payload, replacing raw CV text as generator input
    tasks:
      - Write src/shared/ai/prompts/generation-contract.ts holding the tri-state rule, the impact rule, the relevance rule and the verb rule as one exported fragment, and compose it into tailor-cv, cover-letter and recruiter-message rather than duplicating the text
      - Add a serialiser that renders the evidence base as claim id, text, state and metric for the prompt payload, and have it omit EXCLUDED claims entirely rather than listing them as forbidden
      - Extend each generator output schema with claimsUsed as an array of strings
      - Write claim-validator.ts taking the evidence base and a generation result, and returning the violations - unknown claim id, EXCLUDED claim cited, or a neverInclude phrase present in the output text
      - Wire the validator into tailor-cv.service.ts, cover-letter.service.ts and recruiter-message.service.ts so a violating result is surfaced as a clear error rather than persisted
      - Add claim-validator.test.ts covering an unknown id, an excluded claim, a neverInclude hit and a clean pass
      - Record in the contract fragment that a stronger verb must never change the underlying claim, and that a request to inflate a fact is declined with the honest alternative offered instead
    acceptance:
      - tailor-cv, cover-letter and recruiter-message all compose the same exported contract fragment, provable by a grep showing the fragment imported in each and the rule text present in none of them directly
      - Each of the three generators returns claimsUsed and its result is passed through claim-validator before being persisted or returned
      - A generation citing a claim id absent from the evidence base is rejected, covered by a test
      - A generation citing an EXCLUDED claim is rejected, covered by a test
      - A generation whose text contains a neverInclude phrase is rejected, covered by a test
      - A clean generation passes the validator and is returned unchanged, covered by a test
      - Generators read the serialised evidence base and no longer take raw master CV text as their profile input
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
    done:
      - All three generators run through the contract and the validator, with the four validator cases tested
      - Feature committed
    labels:
      - ai
      - backend
      - quality
      - testing
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - ARCHITECTURE.md
      - docs/TESTING.md
      - memory-bank/decisions.md
    prompt: |
      Implement ONLY this task.

      The validator is the deliverable. A rule that lives only in a prompt is a
      suggestion; the same rule checked in TypeScript against the evidence base
      is a guarantee. Write the check, and make a violation fail loudly rather
      than persist quietly.

      Optimisation means reorder, emphasise, rewrite and select from what is
      already true. It never means adding a tool, a metric, a responsibility or a
      scope of ownership that is not already a claim. If a posting wants
      something the evidence base does not carry, that is a gap to state, not a
      phrase to soften.

      One fragment, composed into every generator. Do not copy the rules into
      three prompt files where they will drift apart.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Duplicate the contract text across individual prompt files
      - Enforce a rule in the prompt alone when it can be checked in code
      - Build the tailoring report - that is TASK-082
      - Change the outreach channel formats - that is TASK-083
      - Feed raw master CV text to a generator once the serialiser exists
