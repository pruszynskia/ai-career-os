  ###############################################################################
  # TASK-005
  ###############################################################################
  - id: TASK-005
    github:
      issue: "5"
      project_item: null
    status: todo
    priority: P0
    estimate: M
    depends_on:
      - TASK-001
    title: Provider-agnostic AI service layer
    goal: >
      Build a server-only AI service abstraction with Anthropic and OpenAI adapters, so all AI features (posts, CV, matching, messages) share one interface and never expose keys to the client.

    scope:
      - src/shared/ai/service.ts
      - src/shared/ai/adapters/anthropic.ts
      - src/shared/ai/adapters/openai.ts
      - src/shared/ai/prompts/**
      - src/shared/ai/types.ts
      - .env.example
    deliverables:
      - AiService interface with a selectable provider
      - Anthropic and OpenAI adapters
      - Zod-validated structured output helper
      - Prompts stored separately from code paths
    tasks:
      - Define the AiService interface and shared types
      - Implement the Anthropic adapter
      - Implement the OpenAI adapter
      - Add provider selection via environment configuration
      - Add a helper for Zod-validated structured responses
      - Establish a prompts directory convention
    acceptance:
      - A sample structured call returns Zod-validated output from either provider
      - No API keys are referenced in client code
      - npm run typecheck reports zero errors
    done:
      - Both adapters implemented
      - Structured output validated
      - Server-only boundary enforced
    labels:
      - ai
      - backend
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/TECH_STACK.md
      - docs/API_GUIDE.md
      - ARCHITECTURE.md
    prompt: |
      Implement ONLY this task.

      Keep the abstraction minimal: one interface, two adapters, one structured
      output helper. Do not add caching, streaming, or retries unless required
      by a later task.

      All AI logic is server-only. Prompts live in the prompts directory.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Expose API keys or AI calls in the frontend
      - Add a third provider or unused features
      - Build a plugin or middleware framework
