      Every generator in this app reads either the flat profiles.skills array or the raw master CV text, so nothing distinguishes a claim the owner could defend in an interview from one the CV overstated, and nothing records what must never be written at all. Add an evidence base on profiles - a list of claims each carrying a state, a risk level and an optional metric, plus neverInclude and alwaysIncludeWhenRelevant rules - and have CV parsing flag only the high-risk claims for a one-tap confirmation on the profile page. This is the data contract every later task in this milestone generates from, so it lands first and lands additively.

    scope:
      - supabase/migrations/
      - src/entities/profile/types.ts
      - src/entities/profile/service.ts
      - src/shared/ai/prompts/parse-cv.ts
      - src/features/cv/services/upload-cv.service.ts
      - src/features/profile/services/update-evidence.service.ts
      - src/features/profile/components/evidence-review.tsx
      - src/app/api/profile/evidence/route.ts
      - ARCHITECTURE.md
    deliverables:
      - A profiles.evidence jsonb column added by an additive migration, leaving skills, experience, projects and score untouched
      - evidenceSchema and claimSchema in src/entities/profile/types.ts, a claim being id, kind, text, sourceRef, state, riskLevel, note and metric
      - Claim states TRUSTED, CONFIRMED, FLAGGED and EXCLUDED, with TRUSTED as the parse-time default
      - Generation rules on the same jsonb - neverInclude and alwaysIncludeWhenRelevant string lists
      - parse-cv emitting a riskLevel per claim so only genuinely risky claims ever need confirming
      - An evidence review panel on the profile page confirming, flagging or excluding a claim in one action
      - PATCH /api/profile/evidence persisting a single claim state change, owner-scoped
      - An implementation matching ADR-017 exactly - the claim shape, the four states and the generation rules
    tasks:
      - Add a migration adding evidence jsonb to profiles with a default empty base, following the existing score jsonb column as the shape precedent, and change no existing column
      - Define claimSchema and evidenceSchema in src/entities/profile/types.ts next to parsedProfileSchema, exporting Claim, ClaimState and EvidenceBase types
      - Extend parseCvSystemPrompt so extraction also returns a claims array, marking riskLevel high for any claim carrying a number, a years-of-experience figure, a seniority label, or a leadership or ownership scope, and low for everything else
      - Build the evidence base in upload-cv.service.ts from the parsed claims, defaulting each to TRUSTED, carrying riskLevel through, and persist it on the profile row in the same write as the parsed profile
      - Add update-evidence.service.ts and PATCH /api/profile/evidence accepting one claim id and its new state, owner-scoped exactly like the existing profile preferences route
      - Add evidence-review.tsx to the profile feature listing only riskLevel high claims still in TRUSTED, each with confirm, flag and exclude actions plus a remaining count, and render nothing when the list is empty
      - Add a rules editor to the same panel writing neverInclude and alwaysIncludeWhenRelevant, seeded empty, so the owner can record a claim that must never appear
      - Implement the claim shape, the four states and the generation rules exactly as ADR-017 already records them, and update the data-model section of ARCHITECTURE.md to name profiles.evidence
    acceptance:
      - profiles.evidence exists and a CV upload populates it with one claim per extracted skill, achievement and scope
      - A claim carrying a number or a years figure is stored with riskLevel high, and one carrying neither is stored as low
      - The profile page lists only unconfirmed high-risk claims, and confirming one removes it from that list and survives a refresh
      - Flagging a claim persists FLAGGED and excluding one persists EXCLUDED, both visible after a reload
      - The skills, experience, projects and score columns are unchanged and every existing profile screen renders exactly as before
      - A profile row created before this migration loads without error and shows an empty evidence base rather than failing
      - The persisted claim shape and state values match ADR-017, and ARCHITECTURE.md names profiles.evidence in its data-model section
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
    done:
      - Evidence base populated from a real CV upload and the high-risk confirmation flow verified end to end
      - Implementation verified against ADR-017 and the feature committed
