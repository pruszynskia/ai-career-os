  # TASK-085
  ###############################################################################
  - id: TASK-085
    github:
      issue: "169"
      project_item: PVTI_lAHOBIVK2M4BeQfRzg6jI0s
    status: done
    priority: P1
    estimate: M
    milestone: "Stage 3 - Evidence and Signal"
    depends_on:
      - TASK-050
      - TASK-079
      - TASK-083
    title: Application outcomes and the response-rate readout
    goal: >
      application_status runs APPLIED, HR, TECHNICAL, TEAM, CEO_OR_MANAGER - every value is a stage and none is an outcome, so an application that was rejected, offered, or simply never answered has nowhere to go and the product can never say what actually worked. Add the terminal outcomes, keep an expired listing distinct from a rejection because no decision was made either way, and build one readout of response rate by fit band, by callback band and by outreach channel. This is what makes the two headline numbers credible over time instead of permanently unvalidated.

    scope:
      - supabase/migrations/
      - src/entities/application/types.ts
      - src/entities/application/service.ts
      - src/features/application/services/update-status.service.ts
      - src/features/dashboard/services/
      - src/features/dashboard/components/
      - src/widgets/application-board/
    deliverables:
      - application_status extended with OFFER, REJECTED, NO_RESPONSE and EXPIRED
      - EXPIRED kept distinct from REJECTED, meaning the listing was withdrawn rather than the candidate turned down
      - Terminal outcomes selectable from the Kanban board and the status control, and excluded from the active pipeline counts
      - A response-rate readout grouping applications by fit band, by callback band and by outreach channel
      - Median days from applied to first reply, computed from the existing append-only status events
      - An honest empty state until there is enough data to report
    tasks:
      - Add a migration extending application_status with OFFER, REJECTED, NO_RESPONSE and EXPIRED using add value if not exists, matching the pattern used for the cv_document_kind enum
      - Update the application entity schema and the status control to offer the four new values, and mark them terminal so the active pipeline counts exclude them
      - Add the terminal outcomes to the Kanban board as a closed lane rather than four more columns, so the board stays readable
      - Auto-suggest EXPIRED when an offer's expires_at has passed and its application is still open, leaving the transition to the user rather than writing it automatically
      - Write a dashboard service computing response rate by fit band, by callback band and by outreach channel from applications joined to their offer fit and their outreach_messages rows
      - Compute median days to first reply from the application_status_events log, treating the first event past APPLIED as the reply
      - Render one readout card on the dashboard, showing an explicit not-enough-data state below a stated minimum rather than a misleading percentage
    acceptance:
      - An application can be moved to OFFER, REJECTED, NO_RESPONSE or EXPIRED and the change persists
      - Terminal applications are excluded from the active pipeline counts on the dashboard
      - EXPIRED and REJECTED are stored and displayed as distinct outcomes
      - An offer past its expires_at with an open application surfaces the EXPIRED suggestion without changing the status by itself
      - The readout groups by fit band, callback band and outreach channel, and each group's numbers match a manual query
      - Median days to first reply is computed from application_status_events and matches a manual calculation on seeded data
      - With fewer applications than the stated minimum the card shows the not-enough-data state rather than a percentage
      - Existing applications on the five original statuses are unaffected
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
    done:
      - Terminal outcomes selectable end to end and the readout matching a manual query
      - Feature committed
    labels:
      - database
      - backend
      - frontend
      - feature
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - ARCHITECTURE.md
      - memory-bank/decisions.md
      - docs/API_GUIDE.md
    prompt: |
      Implement ONLY this task.

      Keep EXPIRED distinct from REJECTED. A pulled listing means no decision was
      made about the candidate either way, and collapsing the two corrupts every
      response-rate number built on top of them.

      Suggest the expired transition, never apply it automatically. The user owns
      their own pipeline state.

      Report honestly. Below the minimum sample size show the not-enough-data
      state - a response rate computed from four applications is noise presented
      as insight, and this readout exists to make the headline numbers credible.

      Reuse the append-only application_status_events log from TASK-050 rather
      than adding new timestamp columns.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Collapse EXPIRED into REJECTED
      - Change a status automatically without the user acting
      - Add timestamp columns that duplicate application_status_events
      - Show a response rate below the stated minimum sample size
      - Add four more columns to the Kanban board
