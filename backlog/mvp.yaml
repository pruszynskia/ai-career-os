      - docs/design-system/mockups/X-onb2-error.dc.html
    prompt: |
      Implement ONLY this task.

      `uploadCv` returns `{ profile, cvDocument }` server-side, but `useUploadCv`'s `onSuccess` throws that value away
      and only calls `router.refresh()` - that refresh is what makes the parent server component re-render with fresh
      data. Follow that same pattern for the done-state summary: read the profile again server-side (onboarding step
      is already a server-rendered flow via `onboarding/page.tsx`), don't try to thread the mutation's client-side
      return value through, and don't add a new API round-trip just to fetch what `router.refresh()` already gives you
      for free.

      There is no real upload-percentage signal anywhere in this stack (`aiService.generateStructured` in
      `upload-cv.service.ts` is a single server-side call, not a chunked/streamed upload) - the "uploading" mockup
      state is `mutation.isPending`, an indeterminate state. Do not fabricate a fake progress percentage.

      `DocumentUploadForm` is shared with `CoverLetterUploadForm` per its own comment - if you change its shape,
      confirm the cover-letter caller still works, or fork a CV-specific variant instead of breaking the shared one.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Fabricate a numeric upload-progress percentage with no real source
      - Thread the mutation's client-side return value through as the summary source instead of a server-side re-read
      - Break DocumentUploadForm's cover-letter usage while changing its CV usage
      - Add a new API route solely to re-fetch what router.refresh() already provides
