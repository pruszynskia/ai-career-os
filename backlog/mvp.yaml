      - A draft containing any ban-list phrase is rejected, covered by a test
      - A draft whose opening line matches one generated for this owner within 30 days is rejected, covered by a test
      - With no contact on file the recruiter-addressed channels are not drafted at all, and the panel shows the posting URL and the reason
      - No generated message contains an invented recipient name, verified by the no-contact path producing no draft
      - The offer detail shows each draft with a live character count against its budget
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
