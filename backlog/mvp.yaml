      - "If proceeding: add \"workspaces\": [\"packages/*\"] to root package.json (npm workspaces, do not switch package manager), add turbo as a devDependency, add turbo.json with pipelines mirroring the existing root npm scripts (dev, build, lint, typecheck, test, format), and update those root scripts to invoke `turbo run <task>` with caching enabled"
