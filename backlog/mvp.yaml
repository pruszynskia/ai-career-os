      Measure the contrast ratios against the final rendered token values before
      writing the table. Do not assume them.

      Dark mode is not activated in this task - that is TASK-067. The .dark block
      is still inert here; you are rewriting its values, not wiring the class.

      Stop immediately after acceptance criteria are met.
    do_not:
