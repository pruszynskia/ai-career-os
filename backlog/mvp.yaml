  - id: TASK-079
    github:
      issue: "163"
      project_item: PVTI_lAHOBIVK2M4BeQfRzg6jIto
    status: done
    priority: P1
    estimate: L
    milestone: "Stage 3 - Evidence and Signal"
    depends_on:
      - TASK-078
      - TASK-033
      - TASK-022
    title: Fit assessment - nine weighted criteria, mechanical sub-scores and callback probability
    goal: >
      job_offers.match_score is a single integer produced by a five-line prompt, so it explains nothing and cannot be acted on, while the twelve job-preference columns TASK-033 added have a form, a PATCH route and no reader anywhere in the codebase. Replace the bare match with a full fit assessment - nine weighted criteria, a separately reasoned callback probability, a missing-skills list and a deterministic recommended-action band - where the four mechanical criteria are computed in TypeScript from those preferences and handed to the model as stated facts rather than re-derived, narrowing the AI call to the five criteria that genuinely need judgment.

    scope:
      - supabase/migrations/
      - src/entities/job-offer/types.ts
      - src/entities/job-offer/service.ts
      - src/shared/ai/prompts/match-offer.ts
      - src/features/job-offer/services/match-offer.service.ts
      - src/features/job-offer/services/mechanical-subscores.ts
      - src/features/job-offer/services/mechanical-subscores.test.ts
    deliverables:
      - A job_offers.fit jsonb column holding the nine sub-scores, reasoning, missing skills, the absent-but-true list, the callback probability and the modifiers applied to it
      - match_score kept as the headline integer so the shipped offer list, sort, filters and dashboard cards keep working unchanged
      - mechanical-subscores.ts computing the core-stack, industry, work-mode and salary sub-scores in TypeScript from jobPreferencesSchema with no AI call
      - A rewritten match-offer prompt scoring only the five judgment criteria and receiving the four mechanical scores as facts it is told not to recompute
      - A deterministic recommendedAction band lookup in TypeScript rather than a model judgment
      - hrCallbackProbability derived from match_score by named modifiers and clamped to the 0 to 100 range
      - absentButTrue listing requirements the posting names that appear in an experience description but not in the skills list
    tasks:
      - Add a migration adding a nullable fit jsonb column to job_offers and leave match_score in place
      - Define fitAssessmentSchema in src/entities/job-offer/types.ts with the nine sub-scores and their fixed weights of 20, 15, 15, 10, 10, 10, 10, 5 and 5, summing to 100
      - Write mechanical-subscores.ts computing core-stack overlap, industry relevance, work-mode compatibility and salary match from the profile preferences, comparing a disclosed salary range against its top rather than its floor
      - Rewrite matchOfferSystemPrompt to score only technical match, seniority match, architecture experience, company attractiveness and experience similarity, reading the four mechanical numbers as given
      - Encode the seniority bands - a posting stating a flexible Mid to Senior band scores 90 to 100, a Mid-labelled posting or a Senior one using preferred rather than required language scores 70 to 89, and an explicit hard years gate scores 0 to 39 even when the stack matches well
      - Compute hrCallbackProbability from match_score with named modifiers - a hard years gate costs 15 to 25 points and the full 25 when stacked with a domain gap, high applicant volume with no differentiator costs 10, an AI-engineering culture signal adds 10, a flexible band adds 8, stated urgency adds 5, and an undisclosed salary costs 10 - recording which modifiers fired
      - Derive recommendedAction by band lookup - 90 and above apply immediately, 80 to 89 strong opportunity, 70 to 79 consider, below 70 ignore
      - Compute absentButTrue by checking each extracted posting requirement against the experience descriptions and the skills list, returning those present in the former and missing from the latter
      - Update match-offer.service.ts to load the profile with its preferences and evidence base, run the mechanical pass first, then the single AI call, and persist both fit and match_score
      - Add mechanical-subscores.test.ts covering the salary range top rule, a missing preference, and each work-mode combination
    acceptance:
      - Scoring an offer writes a fit jsonb carrying all nine sub-scores, each 0 to 100, and a match_score equal to their weighted average rounded to an integer
      - The four mechanical sub-scores are produced with no AI call, proven by mechanical-subscores.test.ts running with no AI service involved
      - A posting advertising a range is scored against the top of that range, covered by a test case
      - A posting stating a flexible Mid to Senior band scores higher on seniority than an otherwise identical posting stating a hard years requirement
      - hrCallbackProbability can differ from match_score, and every modifier applied to it is listed in the fit jsonb
      - recommendedAction matches the band lookup for its match_score in every case
      - A profile with no job preferences set still scores without error, the affected mechanical criteria recorded as unknown rather than silently zero
      - The existing offers list, sort, filters and dashboard cards still render from match_score unchanged
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
    done:
      - Fit assessment persisted for a real offer with the two numbers diverging as designed
      - Mechanical sub-scores unit tested and the feature committed
    labels:
      - database
      - backend
      - ai
      - feature
      - testing
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - ARCHITECTURE.md
      - docs/API_GUIDE.md
      - docs/TESTING.md
    prompt: |
      Implement ONLY this task.

      This is the scoring engine, not its UI - TASK-080 renders it. Persist the
      assessment and keep match_score as the headline integer so nothing that
      already reads it breaks.

      The mechanical half is the point. Four criteria carrying 45 of the 100
      weight must be computed in TypeScript from the job preferences this app
      already collects and never reads, then passed into the prompt as facts the
      model is explicitly told not to recompute. That makes the AI call cheaper
      and the number auditable.

      Compare salary against the top of a disclosed range, not the bottom.
      Rejecting a posting on its floor rejects a number nobody has proposed to
      pay.

      Never round a criterion up to make the overall number look better. Nine
      honest parts are the entire reason for splitting the score.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Drop or repurpose the match_score column
      - Compute any mechanical criterion inside the AI prompt
      - Build fit report UI - that is TASK-080
      - Add job discovery, scraping or a new offer source
      - Use criterion weights that do not sum to 100
