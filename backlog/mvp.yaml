      - docs/design-system/components.md
    prompt: |
      Implement ONLY this task.

      Surface's default elevation becomes flat - no border, no background, no
      shadow. This is the change that does the most work in the whole milestone.
      Do not keep a "subtle" default border because bare content looks unfinished
      in isolation; separation is the job of spacing and type hierarchy, and the
      screens get restructured in TASK-072 through TASK-076.

      Keep Card's sub-component API exactly as it is - CardHeader, CardTitle,
      CardDescription, CardAction, CardContent, CardFooter. 26 files import them.
      Converting individual screens away from Card is the screen tasks' job, not
      this one. This task changes how Card looks, not who uses it.

      Shadow is for overlays only: dialog, popover, select content, toaster. An
      inline card does not get a shadow. No shadow is ever tinted with a colour.

      The dialog overlay loses its backdrop blur. Glassmorphism is banned.

      Stop immediately after acceptance criteria are met.
