tasks:
  ###############################################################################
  # TASK-001
  ###############################################################################
  - id: TASK-001
    github:
      issue: "1"
      project_item: null
    status: todo
    priority: P0
    estimate: XS
    depends_on: []
    title: Initialize repository foundation
    goal: >
      Create a production-ready Next.js + TypeScript project foundation with minimal, deterministic configuration for AI-assisted development.

    scope:
      - package.json
      - next.config.*
      - tsconfig.json
      - eslint.config.*
      - prettier.config.*
      - .editorconfig
      - .gitignore
    deliverables:
      - Next.js app builds successfully
      - TypeScript strict mode enabled
      - ESLint configured
      - Prettier configured
    tasks:
      - Scaffold Next.js app (App Router)
      - Configure TypeScript strict mode
      - Configure ESLint
      - Configure Prettier
      - Add npm scripts (dev, build, lint, typecheck, format)
      - Verify production build
    acceptance:
      - npm run build succeeds
      - npm run lint succeeds
      - npm run typecheck reports zero errors
    done:
      - Build passes
      - Lint passes
      - Configuration committed
    labels:
      - setup
      - architecture
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/PRODUCT.md
      - docs/TECH_STACK.md
      - docs/CODING_STANDARDS.md
      - ARCHITECTURE.md
    prompt: |
      Implement ONLY this task.

      Follow all referenced documentation.

      Keep implementation minimal.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Add unnecessary dependencies
      - Refactor unrelated files
      - Introduce experimental tooling
  ###############################################################################
  # TASK-002
  ###############################################################################
  - id: TASK-002
    github:
      issue: "2"
      project_item: null
    status: todo
    priority: P0
    estimate: M
    depends_on:
      - TASK-001
    title: Database schema and Prisma setup
    goal: >
      Define the PostgreSQL data model with Prisma covering the full MVP domain (profile, CV documents, job offers, applications, posts), provide a seed for the single-user setup, and establish the entity-service layering all backend tasks will follow, keeping later multi-user support additive per ADR-005.

    scope:
      - prisma/schema.prisma
      - prisma/seed.ts
      - src/shared/db/client.ts
      - src/entities/**/service.ts
      - .env.example
    deliverables:
      - Prisma configured against PostgreSQL
      - Domain models and enums defined, each with id/ownerId/createdAt/updatedAt
      - Initial migration created
      - Seed script for single user and empty profile
      - One service module per entity for later route handlers to call
    tasks:
      - Install and configure Prisma with PostgreSQL
      - Define Profile model (summary, skills, experience)
      - Define CvDocument model (master and tailored versions, downloadable content)
      - Define JobOffer model (url, source, rawContent, company, title, description, matchScore, isFavorite)
      - Define Application model (jobOffer, sentCv, recruiterMessage, status, timeline)
      - Define Post model (content, status, scheduledAt, sentAt)
      - Define enums ApplicationStatus, PostStatus, OfferSource
      - Add id, ownerId (ADR-005), createdAt, updatedAt on every top-level model; index ownerId and foreign keys
      - Create initial migration
      - Add seed for single user and empty profile
      - Add a shared Prisma client singleton (src/shared/db/client.ts)
      - Add one empty/minimal service module per entity under src/entities/{entity}/service.ts as the only place later tasks query that entity (ADR-006)
    acceptance:
      - prisma migrate produces a clean initial migration
      - prisma generate succeeds
      - Seed runs without errors
      - npm run typecheck reports zero errors
    done:
      - Schema and migration committed
      - Seed verified
      - Prisma client reused via shared singleton
      - Entity service modules in place for later tasks to extend
    labels:
      - database
      - backend
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/TECH_STACK.md
      - ARCHITECTURE.md
    prompt: |
      Implement ONLY this task.

      Model exactly the entities listed in the task scope, no extra tables.

      Keep the schema single-user in behavior, but add the ownerId column
      called for by ADR-005 so multi-user is additive later, and the
      id/createdAt/updatedAt/ownerId + index convention from ARCHITECTURE.md
      "Backend & Data Layer" on every top-level model. Do not add
      query-level multi-tenant filtering or a users table beyond the seed.

      Create one service module per entity (src/entities/{entity}/service.ts)
      per ADR-006 — later tasks' route handlers call these, never Prisma
      directly.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Add speculative tables or columns beyond ownerId/timestamps
      - Introduce a second ORM or query builder
      - Call Prisma from anywhere other than an entity service module
      - Add multi-tenant query filtering or a users table
  ###############################################################################
  # TASK-003
  ###############################################################################
  - id: TASK-003
    github:
      issue: "3"
      project_item: null
    status: todo
    priority: P0
    estimate: S
    depends_on:
      - TASK-001
      - TASK-002
    title: Minimal single-user authentication
    goal: >
      Gate the application behind a single seeded account so only the owner can access it, without building multi-user infrastructure — but configure Auth.js so OAuth providers (Google, LinkedIn, GitHub, Email) can be added later as additive config per ADR-005.

    scope:
      - src/app/api/auth/[...nextauth]/route.ts
      - src/shared/auth/config.ts
      - src/middleware.ts
      - .env.example
    deliverables:
      - Auth.js configured with a single credentials account from env
      - App routes protected by middleware
      - Sign-in and sign-out flow
    tasks:
      - Configure Auth.js with a credentials provider backed by env values, using the standard `providers` array so more providers are additive later
      - Protect the application route group via middleware
      - Add a minimal sign-in page
      - Add sign-out action
    acceptance:
      - Unauthenticated requests to app routes redirect to sign-in
      - Correct credentials establish a session
      - npm run typecheck reports zero errors
    done:
      - Auth gate verified
      - Sign-in and sign-out working
      - Configuration committed
    labels:
      - auth
      - backend
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/TECH_STACK.md
      - ARCHITECTURE.md
    prompt: |
      Implement ONLY this task.

      Use a single account sourced from environment variables. Do not add a
      users table, registration, password reset, or OAuth providers now —
      just use Auth.js's standard `providers` array/config shape so Google,
      LinkedIn, GitHub, and Email providers are additive later (ADR-005), not
      a framework change.

      Keep it to the smallest working session gate.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Add OAuth providers
      - Add registration or multi-user support
      - Store credentials in the database
  ###############################################################################
