      - Selecting a non-PDF/DOCX file shows an inline unsupported-file error without calling the upload mutation
      - A failed upload (mutation `onError`) shows an inline error in the step, not toast-only
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
    done:
