  # TASK-084
  ###############################################################################
  - id: TASK-084
    github:
      issue: "168"
      project_item: PVTI_lAHOBIVK2M4BeQfRzg6jIzY
    status: done
    priority: P2
    estimate: L
    milestone: "Stage 3 - Evidence and Signal"
    depends_on:
      - TASK-083
      - TASK-011
    title: Warm contacts - LinkedIn connections import and the per-company interlock
    goal: >
      TASK-083 blocks recruiter-addressed drafts when no contact is on file, which is almost always, because the app has no contacts at all. Let the user import their own LinkedIn data export, classify each connection by job title with a deterministic matcher, and surface who they already know at the hiring company on the offer detail. A first-degree connection is both the highest-response and the lowest-risk channel, because the platform's spam machinery punishes requests to strangers rather than messages to people already connected. Add a per-company interlock so the app never suggests contacting two people at the same company inside 30 days.

    scope:
      - supabase/migrations/
      - src/entities/contact/types.ts
      - src/entities/contact/service.ts
      - src/features/contact/services/import-connections.service.ts
      - src/features/contact/services/classify-title.ts
      - src/features/contact/services/classify-title.test.ts
      - src/features/contact/services/interlock.ts
      - src/features/contact/components/
      - src/app/api/contacts/import/route.ts
      - docs/PRODUCT.md
    deliverables:
      - A contacts table owner-scoped by RLS holding name, company, title, profile_url, classification and first_degree
      - A CSV import accepting the Connections file from the user's own LinkedIn data export, reusing the existing upload pattern
      - classify-title.ts assigning each contact one of non-it, generalist, it-recruiter or decision-maker by keyword matching with no AI call
      - A who-you-know panel on the offer detail listing contacts at the hiring company, ranked with first-degree specialists first
      - interlock.ts warning when another contact at the same company was messaged within 30 days
      - A manually added contact path, so the feature works without an import
    tasks:
      - Add a migration creating contacts with owner_id, name, company, title, profile_url, classification, first_degree and created_at, plus the standard owner_all RLS policy
      - Add the contact entity slice with its Zod schema and service, following the existing entity pattern
      - Write import-connections.service.ts parsing the Connections CSV from a LinkedIn data export, tolerating the note rows the export puts above the header, and skipping rows with no company
      - Write classify-title.ts as a deterministic keyword matcher over the job title, returning non-it for HR business partner and people partner titles, it-recruiter for technical recruiting titles, decision-maker for engineering lead, manager, head, director and founder titles, and generalist otherwise
      - Add POST /api/contacts/import accepting the CSV upload, reusing the file handling already used by CV upload, and reporting how many rows were imported, classified and skipped
      - Add a who-you-know panel to the offer detail querying contacts by normalised company name, ranked first-degree specialists first, with a manual add-contact action beside it
      - Write interlock.ts checking outreach_messages for another contact at the same company within 30 days, and surface it as a warning on the outreach panel rather than a hard block
      - Wire a selected contact into TASK-083's outreach generation so the drafts are addressed to a real, named person
      - Add classify-title.test.ts covering each classification branch and an unmatched title
      - Document the import in docs/PRODUCT.md as the user's own exported data, not a scrape or a LinkedIn API integration
    acceptance:
      - Importing a real LinkedIn Connections CSV creates one contact row per valid data row and reports the counts imported, classified and skipped
      - An HR business partner title classifies as non-it and an engineering manager title as decision-maker, both covered by tests
      - Classification runs with no AI service involved, proven by classify-title.test.ts
      - The offer detail lists contacts matching the hiring company, and shows nothing rather than a guess when there is no match
      - Selecting a contact makes TASK-083's drafts address that named person
      - A second contact at a company messaged within the last 30 days raises the interlock warning
      - A contact added manually works identically to an imported one, with no import required
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
    done:
      - A real connections export imported and classified, and drafts addressed to a selected contact
      - Interlock warning verified and the feature committed
    labels:
      - database
      - backend
      - frontend
      - feature
      - testing
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - ARCHITECTURE.md
      - docs/API_GUIDE.md
      - docs/PRODUCT.md
    prompt: |
      Implement ONLY this task.

      This reads a file the user exports from their own account. It is not a
      scrape, not an automation, and not a LinkedIn API integration - ADR-002
      still holds and nothing here contacts LinkedIn.

      Classification is keyword matching, not an AI call. Titles are short and
      the categories are few; spending a model call per contact on a list of
      several hundred would be waste.

      The interlock is a warning, not a block. The user may have a good reason to
      contact two people at one company, and this app advises rather than
      forbids.

      Never fabricate a contact to fill the panel. An empty result is the correct
      answer when nobody matches.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Call the LinkedIn API or scrape any profile
      - Use an AI call to classify a job title
      - Invent a contact, a company match or a profile URL
      - Hard block outreach on the interlock
      - Require the import before the outreach feature works
