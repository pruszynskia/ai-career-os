  ###############################################################################
  # TASK-002
  ###############################################################################
  - id: TASK-002
    github:
      issue: "2"
      project_item: null
    status: done
    priority: P0
    estimate: M
    milestone: MVP
    depends_on:
      - TASK-001
    title: Database schema and Supabase Postgres setup
    goal: >
      Define the Supabase PostgreSQL data model covering the full MVP domain (profile, CV documents, job offers, applications, posts), enforce per-owner authorization with Row Level Security instead of app-level filtering, and establish the entity-service layering all backend tasks follow, keeping later multi-user support additive per ADR-005/ADR-009.

    scope:
      - supabase/migrations/*.sql
      - src/shared/db/client.ts
      - src/shared/db/admin.ts
      - src/entities/**/service.ts
      - src/entities/**/types.ts
      - .env.example
    deliverables:
      - Supabase Postgres schema and RLS policies committed as SQL migrations
      - Domain tables and enums defined, each with id/owner_id/created_at/updated_at
      - Per-request Supabase server client and a service-role admin client
      - One service module per entity for later route handlers to call
    tasks:
      - Write supabase/migrations/*.sql defining every table (profiles, cv_documents, job_offers, applications, posts) and enum (application_status, post_status, offer_source)
      - Add id, owner_id (references auth.users, ADR-005/ADR-009), created_at, updated_at on every top-level table; index owner_id and foreign keys
      - Enable Row Level Security on every table with an owner_id = auth.uid() policy
      - Add a per-request Supabase server client (src/shared/db/client.ts) and a service-role admin client (src/shared/db/admin.ts, never used in request-handling code)
      - Add one service module per entity under src/entities/{entity}/service.ts as the only place later tasks query that entity (ADR-006/ADR-009), plus a canonical types.ts per entity
    acceptance:
      - supabase/migrations/*.sql applies cleanly against a Supabase project
      - RLS is enabled with an owner-scoped policy on every table
      - npm run typecheck reports zero errors
    done:
      - Schema and RLS policies committed as SQL migrations
      - Supabase client singleton pattern in place (per-request server client + admin client)
      - Entity service modules in place for later tasks to extend
    labels:
      - database
      - backend
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/TECH_STACK.md
      - ARCHITECTURE.md
    prompt: |
      Implement ONLY this task.

      Model exactly the entities listed in the task scope, no extra tables.

      Keep the schema single-user in behavior, but add the owner_id column
      called for by ADR-005/ADR-009 so multi-user is additive later, and the
      id/created_at/updated_at/owner_id + index convention from
      ARCHITECTURE.md "Backend & Data Layer" on every top-level table.
      Enforce owner scoping via RLS policies, not query-level filtering.

      Create one service module per entity (src/entities/{entity}/service.ts)
      per ADR-006/ADR-009 — later tasks' route handlers call these, never the
      Supabase client directly.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Add speculative tables or columns beyond owner_id/timestamps
      - Introduce an ORM
      - Call the Supabase client from anywhere other than an entity service module
      - Add multi-tenant query filtering or a users table
  ###############################################################################
  # TASK-003
  ###############################################################################
  - id: TASK-003
    github:
      issue: "3"
      project_item: null
    status: done
    priority: P0
    estimate: S
    milestone: MVP
    depends_on:
      - TASK-001
      - TASK-002
    title: Minimal single-user authentication
    goal: >
      Gate the application behind a single seeded Supabase Auth account so only the owner can access it, without building multi-user infrastructure — OAuth providers (Google, LinkedIn, GitHub) can be added later as a Supabase dashboard toggle per ADR-005/ADR-009.

    scope:
      - scripts/create-owner-user.ts
      - src/shared/auth/session.ts
      - src/shared/auth/actions.ts
      - src/middleware.ts
      - src/app/sign-in/page.tsx
      - .env.example
    deliverables:
      - Single Supabase Auth account provisioned via a one-off admin script
      - App routes protected by middleware using @supabase/ssr session handling
      - Sign-in and sign-out flow
    tasks:
      - Add scripts/create-owner-user.ts using the Supabase admin client to provision the single owner account from env values
      - Protect the application route group via middleware using @supabase/ssr's session-refresh pattern
      - Add a minimal sign-in page calling supabase.auth.signInWithPassword
      - Add a sign-out server action calling supabase.auth.signOut
    acceptance:
      - Unauthenticated requests to app routes redirect to sign-in
      - Correct credentials establish a session
      - npm run typecheck reports zero errors
    done:
      - Auth gate verified
      - Sign-in and sign-out working
      - Configuration committed
    labels:
      - auth
      - backend
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/TECH_STACK.md
      - ARCHITECTURE.md
    prompt: |
      Implement ONLY this task.

      Use a single account provisioned in Supabase Auth. Do not add a
      registration flow, password reset, or OAuth providers now — Supabase
      Auth already supports adding Google/LinkedIn/GitHub as a dashboard
      toggle later (ADR-005/ADR-009), not a framework change.

      Keep it to the smallest working session gate.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Add OAuth providers
      - Add registration or multi-user support
      - Store credentials outside Supabase Auth
