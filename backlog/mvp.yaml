  - id: TASK-066
    github:
      issue: "149"
      project_item: PVTI_lAHOBIVK2M4BeQfRzg5zLgM
    status: done
    priority: P1
    estimate: M
    milestone: "Design System Overhaul"
    depends_on: []
    title: Design token foundation - warm-neutral ramp, neutral-inverse primary and amber signal accent
    goal: >
      ADR-010's Deep Navy / Electric Blue / Emerald identity reads as a generic template and is being replaced. Rebuild the token layer in src/app/globals.css around a warm-shifted neutral ramp (OKLCH hue 75, very low chroma, never pure black or white), a primary action that is the high-contrast inverse of the canvas rather than a brand hue (the Vercel/Attio move, which structurally cannot collide with status colour), and a single amber signal accent (hue 55) restricted to interaction states. Keep the shadcn semantic token names as the layer components consume, so every existing component and every dark: utility keeps working - this is a token-value swap plus two new tokens, not a token-system rewrite. Record the new identity as an ADR superseding ADR-010.

    scope:
      - src/app/globals.css
      - docs/design-system/colors.md
      - memory-bank/decisions.md
      - ARCHITECTURE.md
    deliverables:
      - A Tier-1 primitive ramp in globals.css that the shadcn semantic tokens alias, for both the :root and .dark blocks
      - --primary set to the neutral inverse of the canvas in both themes, replacing Deep Navy
      - --accent set to the amber signal in both themes, replacing Electric Blue, with a dark --accent-foreground in both themes
      - New --warning and --info semantic tokens wired into the @theme inline block so bg-warning / text-info resolve
      - Radius scale capped at 8px, with --radius-xl through --radius-4xl remapped down so existing rounded-xl usages degrade correctly
      - Motion tokens (--dur-fast, --dur, --dur-slow, --ease) defined once in globals.css
      - An ADR superseding ADR-010, recording the neutral-inverse primary, the amber signal accent and the ~90/8/2 colour budget
    tasks:
      - Replace the :root and .dark colour blocks in src/app/globals.css with the warm-neutral ramp - canvas, sunken, raised, raised-hover, hairline border, strong border, muted/secondary/primary text - keeping every existing shadcn semantic custom-property name so no component import changes
      - Set --primary to near-white on dark and near-black on light, with --primary-foreground as its opposite, and set --accent to the amber signal (hue 55) with --accent-foreground as dark ink in BOTH themes because amber is a light colour and white text on it fails AA
      - Add --warning (hue 95) and --info (hue 240) custom properties in both themes and expose them in @theme inline as --color-warning / --color-warning-foreground / --color-info / --color-info-foreground, following the existing --color-success pattern
      - Set --radius to 0.375rem and remap --radius-xl, --radius-2xl, --radius-3xl and --radius-4xl so none resolve above 8px, so the four existing rounded-xl call sites stop rendering as pill-soft boxes before they are individually cleaned up in TASK-069
      - Add --dur-fast (100ms), --dur (160ms), --dur-slow (240ms) and --ease (cubic-bezier(0.2, 0, 0, 1)) to globals.css for TASK-077 to consume
      - Rewrite docs/design-system/colors.md for the new ramp - including the measured WCAG AA contrast table for both themes and the ~90% neutral / ~8% ink / ~2% accent budget rule
      - Record the ADR in memory-bank/decisions.md superseding ADR-010, and update ARCHITECTURE.md's design-system section to match
    acceptance:
      - Every colour custom property in src/app/globals.css resolves through the Tier-1 ramp - no semantic token is assigned a literal oklch() value directly except the ramp itself
      - bg-warning, text-warning-foreground, bg-info and text-info-foreground all resolve to real colours in a rendered page in both themes
      - No utility class in src/ resolves to a border radius greater than 8px - verified by grepping for rounded-xl, rounded-2xl, rounded-3xl and rounded-4xl and confirming the remapped scale caps at 8px
      - docs/design-system/colors.md contains a contrast table showing every text-on-surface pairing at AA or better for BOTH the light and dark themes, measured against the final token values rather than assumed
      - memory-bank/decisions.md contains a new ADR that explicitly names ADR-010 as superseded
      - npm run test, npm run typecheck, npm run lint and npm run build succeed
    done:
      - Token layer replaced and contrast verified in both themes
      - Feature committed
    labels:
      - ui
      - frontend
      - architecture
      - documentation
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/design-system/colors.md
      - memory-bank/decisions.md
      - ARCHITECTURE.md
    prompt: |
      Implement ONLY this task.

      Keep the shadcn semantic token NAMES exactly as they are. Components must
      not change their imports or their utility classes in this task - the whole
      point is that re-pointing the token values re-skins the app without
      touching component code. Component cleanup is TASK-069.

      --primary is deliberately NOT a brand hue. It is the high-contrast inverse
      of the canvas: near-white on dark, near-black on light. Do not reintroduce
      a coloured primary button.

      --accent-foreground must be dark ink in BOTH themes. Amber is a light
