      - Providers wired and committed
    labels:
      - frontend
      - ui
      - state
    context:
      architecture:
        - project-overview
      standards:
        - coding-standards
    references:
      - docs/TECH_STACK.md
      - docs/COMPONENT_GUIDE.md
      - docs/STATE_MANAGEMENT.md
      - ARCHITECTURE.md
    prompt: |
      Implement ONLY this task.

      Reuse shadcn/ui primitives; do not hand-roll components that shadcn
      provides. Any new reusable component uses a `variant` prop (cva) rather
      than boolean props, per docs/COMPONENT_GUIDE.md. Keep placeholder
      routes empty pending their feature tasks.

      Stop immediately after acceptance criteria are met.
    do_not:
      - Implement feature screens here
      - Store server data in Zustand
      - Add unnecessary UI dependencies
